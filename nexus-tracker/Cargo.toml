[package]
name = "nexus-tracker"
version = "0.1.2"
edition = "2024"
license = "MIT"
authors = ["Josh Ellithorpe <quest@mac.com>"]
description = "Discovery service for Nexus BBS servers"

[dependencies]
nexus-common = { path = "../nexus-common", features = ["logging", "tls", "upnp", "websocket"] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.49", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "signal"] }
tracing = "0.1"
dirs = "6.0"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
idna = "1"
# Pinned: 7.5 broke the macOS CI build (transitively bumped windows-sys
# in a way that confused the universal2 cross-compile). Revisit if 7.6+
# fixes it.
rpassword = "=7.4.0"
tokio-rustls = { version = "0.26", features = ["ring"] }
tokio-tungstenite = "0.29"
fluent = "0.17"
fluent-bundle = "0.16"
unic-langid = "0.9"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.49", features = ["test-util"] }
fluent-syntax = "0.12"

[lib]
name = "nexus_tracker"
path = "src/lib.rs"

[[bin]]
name = "nexus-trackerd"
path = "src/main.rs"
