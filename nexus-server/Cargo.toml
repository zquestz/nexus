[package]
name = "nexus-server"
version = "0.8.4"
edition = "2024"
license = "MIT"
authors = ["Josh Ellithorpe <quest@mac.com>"]
description = "Cross-platform BBS server"

[dependencies]
nexus-common = { path = "../nexus-common", features = [
    "avatar-decode",
    "logging",
    "tls",
    "upnp",
    "websocket",
] }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.49", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "signal"] }
tracing = "0.1"
serde_json = "1.0"
socket2 = "0.6"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
chrono = "0.4"
dirs = "6.0"
argon2 = { version = "0.5", features = ["std"] }
strum = { version = "0.28", features = ["derive"] }
tokio-rustls = "0.26"
tokio-tungstenite = "0.29"
futures-util = "0.3"
sha2 = "0.11"
fluent = "0.17"
fluent-bundle = "0.16"
hex = "0.4"
unic-langid = "0.9"
infer = "0.19"
rand = "0.10"
iprange = "0.6"
ipnet = "2.11"
walkdir = "2.5"
grep-searcher = "0.1"
grep-regex = "0.1"
regex = "1.12"
uuid = { version = "1.20", features = ["v4", "serde"] }
csv = "1.3"
dtls = { version = "0.17", features = ["pem"] }
webrtc-util = "0.17"

[dev-dependencies]
tempfile = "3.20"
rcgen = "0.14"
fluent-syntax = "0.12"

[lib]
name = "nexus_server"
path = "src/lib.rs"

[[bin]]
name = "nexusd"
path = "src/main.rs"
