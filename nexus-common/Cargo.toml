[package]
name = "nexus-common"
version = "0.8.1"
edition = "2024"
license = "MIT"
authors = ["Josh Ellithorpe <quest@mac.com>"]
description = "Common code for Nexus BBS"

[dependencies]
idna = "1"
rand = "0.10"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.20", features = ["v4", "serde"] }
tokio = { version = "1.49", features = ["io-util", "macros", "rt", "sync", "time"] }
sha2 = "0.11"
hex = "0.4"
zxcvbn = "3.1"

# Optional, enabled by the `websocket` feature.
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.29", optional = true }

# Optional, enabled by the `upnp` or `logging` feature.
igd-next = { version = "0.17", optional = true }
tracing = { version = "0.1", optional = true }

# Optional, enabled by the `logging` feature.
tracing-subscriber = { version = "0.3", features = ["json"], optional = true }
tracing-appender = { version = "0.2", optional = true }
humantime = { version = "2.1", optional = true }

[features]
# WebSocket byte-stream adapter (`nexus_common::websocket::WebSocketAdapter`).
# Enabled by daemons that need to serve WS in addition to TCP. Pulls in
# `tokio-tungstenite` and `futures-util`. Disabled by default so consumers
# that don't need WS plumbing (e.g., nexus-client) don't pay for it.
websocket = ["dep:futures-util", "dep:tokio-tungstenite"]

# UPnP/IGD port-forwarding (`nexus_common::upnp::UpnpGateway`). Enabled by
# daemons that want optional NAT traversal at startup. Pulls in `igd-next`
# and `tracing` for operator-facing log output.
upnp = ["dep:igd-next", "dep:tracing"]

# Tracing subscriber + log-file rotation (`nexus_common::logging`). Enabled
# by daemons that want a shared logging stack (level parsing, daily file
# rotation, retention purge timer, current-level accessor). Disabled by
# default — `nexus-client` brings its own stderr-only setup.
logging = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:humantime",
]

[dev-dependencies]
tempfile = "3.20"

[lib]
name = "nexus_common"
path = "src/lib.rs"
