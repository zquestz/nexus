[package]
name = "nexus-common"
version = "0.9.1"
edition = "2024"
license = "MIT"
authors = ["Josh Ellithorpe <quest@mac.com>"]
description = "Common code for Nexus BBS"

[dependencies]
idna = "1"
ipnet = "2.11"
rand = "0.10"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.20", features = ["v4", "serde"] }
tokio = { version = "1.49", features = ["io-util", "macros", "rt", "sync", "time"] }
sha2 = "0.11"
blake3 = "1.5"
hex = "0.4"
zxcvbn = "3.1"

# Optional, enabled by the `websocket` feature.
futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.29", optional = true }

# Optional, enabled by the `upnp` or `logging` feature.
igd-next = { version = "0.17", optional = true }
tracing = { version = "0.1", optional = true }

# Optional, enabled by the `logging` feature.
tracing-subscriber = { version = "0.3", features = ["json"], optional = true }
tracing-appender = { version = "0.2", optional = true }
humantime = { version = "2.1", optional = true }

# Optional, enabled by the `tls` feature.
tokio-rustls = { version = "0.26", features = ["ring"], optional = true }
rustls-pemfile = { version = "2.2", optional = true }
rcgen = { version = "0.14", optional = true }
pem = { version = "3.0", optional = true }
time = { version = "0.3", optional = true }

# Optional, enabled by the `avatar-decode` feature.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
], optional = true }
base64 = { version = "0.22", optional = true }
usvg = { version = "0.45", optional = true }

[features]
# WebSocket byte-stream adapter (`nexus_common::websocket::WebSocketAdapter`).
# Enabled by daemons that need to serve WS in addition to TCP. Pulls in
# `tokio-tungstenite` and `futures-util`. Disabled by default so consumers
# that don't need WS plumbing (e.g., nexus-client) don't pay for it.
websocket = ["dep:futures-util", "dep:tokio-tungstenite"]

# UPnP/IGD port-forwarding (`nexus_common::upnp::UpnpGateway`). Enabled by
# daemons that want optional NAT traversal at startup. Pulls in `igd-next`
# and `tracing` for operator-facing log output.
upnp = ["dep:igd-next", "dep:tracing"]

# Tracing subscriber + log-file rotation (`nexus_common::logging`). Enabled
# by daemons that want a shared logging stack (level parsing, daily file
# rotation, retention purge timer, current-level accessor). Disabled by
# default — `nexus-client` brings its own stderr-only setup.
logging = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:humantime",
]

# TLS certificate lifecycle (`nexus_common::tls`). Enabled by daemons
# that load or generate self-signed cert + key on disk and build a
# `TlsAcceptor`. Pulls in `tokio-rustls`, `rustls-pemfile`, `rcgen`,
# `pem`, and `tracing` (for operator-visible info logs). Also needs
# tokio's `net` feature for `TcpStream` in the slowloris-bounded
# `accept_tls_with_timeout` helper. Disabled by default — `nexus-client`
# does TLS as a *client* and doesn't need this.
tls = [
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:rcgen",
    "dep:pem",
    "dep:time",
    "dep:tracing",
    "tokio/net",
]

# Full avatar decode-validation: `validate_avatar` actually decodes the payload
# (raster via `image`, SVG via the `usvg` parser — the same engine the client
# renders with) rather than only checking shape/MIME/size, so a
# well-formed-but-undecodable data URI is rejected at the boundary. Enabled by
# nexus-client and nexus-server so both accept exactly the same avatars; the tracker
# doesn't validate avatars, so it stays lean. Pulls in `image`, `base64`, and `usvg`.
avatar-decode = ["dep:image", "dep:base64", "dep:usvg"]

[dev-dependencies]
tempfile = "3.20"

[lib]
name = "nexus_common"
path = "src/lib.rs"
