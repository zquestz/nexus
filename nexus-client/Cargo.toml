[package]
name = "nexus-client"
version = "0.9.11"
edition.workspace = true
license = "MIT"
authors = ["Josh Ellithorpe <quest@mac.com>"]
description = "Cross-platform BBS client"

[package.metadata.bundle]
name = "Nexus BBS"
identifier = "at.greyh.nexus"
icon = ["assets/macos/nexus.png", "assets/windows/nexus.ico"]
category = "public.app-category.social-networking"

short_description = "Cross-platform BBS client"
long_description = """
Nexus is a modern BBS (Bulletin Board System) client supporting chat,
file transfers, news, and user management. Features include mandatory TLS
encryption, 30 themes, 13 language translations, and cross-platform support.
"""
copyright = "Copyright (c) 2026 Nexus BBS Project"

# Linux-specific settings
linux_exec_args = "%u"
linux_mime_types = ["x-scheme-handler/nexus"]

# macOS-specific settings
osx_url_schemes = ["nexus"]

# Windows-specific settings
windows_url_schemes = ["nexus"]

# Debian package dependencies (runtime libraries)
deb_depends = ["libasound2"]

[dependencies]
nexus-common = { path = "../nexus-common", features = ["image-decode"] }
idna = "1"
iced = { version = "0.14", features = ["advanced", "image-without-codecs", "lazy", "markdown", "svg", "tokio"] }
iced_aw = { version = "0.14", features = ["context_menu", "number_input", "tabs"] }
# Direct dep for `iced_runtime::task::widget(...)` — wraps a widget
# `Operation` as a `Task` so handlers can query the actually-focused
# input id (`find_focused`) at Tab time, not a stale local tracker.
# Already pulled in transitively via `iced`; explicit dep just exposes
# the un-re-exported helper.
iced_runtime = "0.14"
iced_toasts = { git = "https://github.com/zquestz/iced-toasts" }
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
chrono = "0.4"
dirs = "6.0"
tokio-rustls = "0.26"
tokio-socks = "0.5"
rustls-native-certs = "0.8"
webpki-roots = "1.0"
sha2 = "0.11"
hkdf = "0.13"
chacha20poly1305 = "0.11"
sys-locale = "0.3"
fluent-bundle = "0.16"
unic-langid = "0.9"
open = "5"
linkify = { git = "https://github.com/zquestz/linkify" }
rfd = "0.17"
base64 = "0.22"
identicon-rs = "7.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
usvg = "0.47"
uuid = { version = "1.20", features = ["v4", "serde"] }
webrtc-audio-processing = { git = "https://github.com/zquestz/webrtc-audio-processing", features = ["bundled", "experimental-aec3-config"] }
hex = "0.4"
percent-encoding = "2.3"
notify-rust = "4.11"
lewton = "0.10"
interprocess = { version = "2.2", features = ["tokio"] }
cpal = "0.18"
opus = "0.3"
global-hotkey = "0.8"
dtls = { version = "0.17", features = ["pem"] }
webrtc-util = "0.17"
async-trait = "0.1"
crossbeam-channel = "0.5.15"
rubato = "3.0"
audioadapter-buffers = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.24"
widestring = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[dev-dependencies]
tempfile = "3.20"
serial_test = "3.2"
fluent-syntax = "0.12"
rcgen = "0.14"

[build-dependencies]
# Pinned to a known-good rev: upstream master tracks iced master (incompatible
# with our `iced = "0.14"`), and crates.io `0.14.1`'s transitive tree includes
# a broken `lzma-rust2 0.15.3`. Bump alongside iced upgrades.
iced_fontello = { git = "https://github.com/hecrj/iced_fontello", rev = "4b3ffa010f18d56baf6d72927dbacbd77b948eb0" }

[[bin]]
name = "nexus"
path = "src/main.rs"
